<form action="register" method="post">

    <input
        type="text"
        name="name"
        placeholder="Full Name"
        required>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <select name="role">

        <option value="Patient">
            Patient
        </option>

        <option value="Doctor">
            Doctor
        </option>

    </select>

    <button type="submit">
        Register
    </button>

</form>
