name: Java checks

on:
  push:
  pull_request:

jobs:
  utility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile utility tests
        run: mkdir -p build/test-classes && javac -encoding UTF-8 -d build/test-classes util/PasswordUtil.java util/AppointmentTimeValidator.java tests/PasswordUtilTest.java tests/AppointmentTimeValidatorTest.java
      - name: Run utility tests
        run: java -cp build/test-classes tests.PasswordUtilTest && java -cp build/test-classes tests.AppointmentTimeValidatorTest
